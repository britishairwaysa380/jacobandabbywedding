<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#2A3257">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Abby & Jacob">
<link rel="manifest" href="manifest.json">
<title>Abby &amp; Jacob</title>
<style>
  :root{
    --lilac:#8B7DD8; --lilac-soft:#EDEAF9; --lilac-deep:#5E51A8;
    --navy:#2A3257; --navy-soft:#3A4470;
    --ink:#23263B; --muted:#7A7E96; --line:#E7E5F0;
    --bg:#FBFAFD; --card:#FFFFFF; --gold:#C9A84C;
    --highlight:#FCF6E4; --highlight-line:#E8D89A;
    --radius:16px; --radius-sm:11px;
    --serif:Georgia,'Times New Roman',serif;
    --sans:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{margin:0;padding:0;}
  body{
    font-family:var(--sans); background:var(--bg); color:var(--ink);
    line-height:1.5; padding-bottom:84px;
    -webkit-font-smoothing:antialiased;
  }
  /* ---------- HEADER ---------- */
  header{
    background:var(--navy); color:#fff; padding:20px 18px 16px;
    position:sticky; top:0; z-index:30;
  }
  .h-couple{font-family:var(--serif); font-size:25px; letter-spacing:.5px; margin:0; font-weight:400;}
  .h-couple .amp{color:var(--lilac); font-style:italic;}
  .h-sub{font-size:12px; color:#B9BDD6; margin:3px 0 0; letter-spacing:.4px; text-transform:uppercase;}
  /* ---------- VIEWS ---------- */
  main{padding:18px 16px 8px; max-width:560px; margin:0 auto;}
  .view{display:none; animation:fade .25s ease;}
  .view.active{display:block;}
  @keyframes fade{from{opacity:0;transform:translateY(6px);}to{opacity:1;transform:none;}}
  h2.section{font-family:var(--serif); font-weight:400; font-size:20px; margin:4px 0 14px; color:var(--navy);}
  /* ---------- HOME ---------- */
  .today-banner{
    background:linear-gradient(135deg,var(--lilac) 0%,var(--lilac-deep) 100%);
    color:#fff; border-radius:var(--radius); padding:18px 18px 16px; margin-bottom:18px;
  }
  .today-banner .tb-label{font-size:11px; letter-spacing:1.5px; text-transform:uppercase; opacity:.85; margin:0;}
  .today-banner .tb-day{font-family:var(--serif); font-size:24px; margin:4px 0 2px;}
  .today-banner .tb-sub{font-size:13px; opacity:.92; margin:0;}
  .countdown{display:flex; gap:8px; margin-top:14px;}
  .cd-box{flex:1; background:rgba(255,255,255,.16); border-radius:var(--radius-sm); padding:9px 4px; text-align:center;}
  .cd-num{font-size:22px; font-weight:600; line-height:1;}
  .cd-lbl{font-size:10px; letter-spacing:1px; text-transform:uppercase; opacity:.85; margin-top:3px;}
  /* day-at-a-glance list */
  .glance-row{
    display:flex; gap:12px; padding:11px 0; border-bottom:1px solid var(--line);
  }
  .glance-row:last-child{border-bottom:none;}
  .glance-time{flex:0 0 70px; font-size:13px; font-weight:600; color:var(--lilac-deep); padding-top:1px;}
  .glance-body{flex:1;}
  .glance-event{font-size:14px; color:var(--ink);}
  .glance-who{font-size:12px; color:var(--muted); margin-top:2px;}
  .glance-row.hl{background:var(--highlight); margin:0 -10px; padding:11px 10px; border-radius:10px; border-bottom:none;}
  .glance-row.hl + .glance-row{border-top:none;}
  .star{color:var(--gold); font-size:11px; margin-left:5px;}
  /* quick links */
  .quick-grid{display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-bottom:18px;}
  .quick-card{
    background:var(--card); border:1px solid var(--line); border-radius:var(--radius-sm);
    padding:14px; text-align:left; cursor:pointer; font-family:var(--sans);
    transition:transform .12s, border-color .12s;
  }
  .quick-card:active{transform:scale(.97);}
  .qc-icon{font-size:20px; margin-bottom:6px;}
  .qc-title{font-size:14px; font-weight:600; color:var(--navy);}
  .qc-sub{font-size:11.5px; color:var(--muted); margin-top:2px;}
  /* ---------- DAY SELECTOR ---------- */
  .day-tabs{display:flex; gap:6px; overflow-x:auto; padding-bottom:4px; margin-bottom:14px; scrollbar-width:none;}
  .day-tabs::-webkit-scrollbar{display:none;}
  .day-tab{
    flex:0 0 auto; padding:7px 13px; border-radius:20px; border:1px solid var(--line);
    background:var(--card); font-size:13px; color:var(--muted); cursor:pointer; white-space:nowrap;
    font-family:var(--sans); font-weight:500;
  }
  .day-tab.active{background:var(--navy); color:#fff; border-color:var(--navy);}
  .day-tab.is-today{border-color:var(--lilac); color:var(--lilac-deep);}
  .day-tab.is-today.active{background:var(--lilac-deep); color:#fff; border-color:var(--lilac-deep);}
  .day-head{margin-bottom:12px;}
  .day-head .dh-title{font-family:var(--serif); font-size:21px; color:var(--navy); margin:0;}
  .day-head .dh-sub{font-size:12.5px; color:var(--muted); margin:3px 0 0;}
  /* schedule rows */
  .sched-row{
    display:flex; gap:12px; background:var(--card); border:1px solid var(--line);
    border-radius:var(--radius-sm); padding:12px 13px; margin-bottom:8px;
  }
  .sched-row.hl{background:var(--highlight); border-color:var(--highlight-line);}
  .sr-time{flex:0 0 64px; font-size:12.5px; font-weight:600; color:var(--lilac-deep);}
  .sr-body{flex:1; min-width:0;}
  .sr-event{font-size:14px; color:var(--ink); font-weight:500;}
  .sr-meta{font-size:12px; color:var(--muted); margin-top:3px;}
  .sr-meta b{color:#5C6079; font-weight:600;}
  .sr-notes{font-size:11.5px; color:var(--muted); margin-top:4px; font-style:italic; line-height:1.45;}
  /* ---------- PEOPLE ---------- */
  .search-wrap{position:relative; margin-bottom:12px;}
  .search-box{
    width:100%; padding:11px 14px 11px 38px; border:1px solid var(--line); border-radius:24px;
    font-size:15px; font-family:var(--sans); background:var(--card); color:var(--ink); outline:none;
  }
  .search-box:focus{border-color:var(--lilac);}
  .search-ic{position:absolute; left:14px; top:50%; transform:translateY(-50%); color:var(--muted); font-size:15px;}
  .filter-chips{display:flex; gap:7px; overflow-x:auto; padding-bottom:4px; margin-bottom:14px; scrollbar-width:none;}
  .filter-chips::-webkit-scrollbar{display:none;}
  .chip{
    flex:0 0 auto; padding:6px 14px; border-radius:18px; border:1px solid var(--line);
    background:var(--card); font-size:13px; color:var(--muted); cursor:pointer; white-space:nowrap;
    font-family:var(--sans); font-weight:500;
  }
  .chip.active{background:var(--lilac); color:#fff; border-color:var(--lilac);}
  .person-card{
    background:var(--card); border:1px solid var(--line); border-radius:var(--radius-sm);
    padding:13px 14px; margin-bottom:9px; cursor:pointer; transition:transform .1s;
  }
  .person-card:active{transform:scale(.99);}
  .pc-head{display:flex; align-items:center; gap:12px;}
  .avatar{
    flex:0 0 42px; width:42px; height:42px; border-radius:50%;
    display:flex; align-items:center; justify-content:center;
    font-size:14px; font-weight:600; color:#fff; background:var(--lilac);
  }
  .avatar.g-Family{background:var(--navy);}
  .avatar.g-Groomsmen{background:var(--lilac-deep);}
  .avatar.g-Bridesmaids{background:#B57BA6;}
  .avatar.g-TheCouple{background:var(--gold);}
  .pc-name{font-size:15px; font-weight:600; color:var(--ink);}
  .pc-role{font-size:12px; color:var(--muted); margin-top:1px;}
  .pc-chev{margin-left:auto; color:var(--line); font-size:18px;}
  .pc-events{margin-top:11px; padding-top:11px; border-top:1px solid var(--line); display:none;}
  .person-card.open .pc-events{display:block;}
  .person-card.open .pc-chev{transform:rotate(90deg); color:var(--lilac);}
  .ev-row{display:flex; gap:10px; padding:6px 0;}
  .ev-day{flex:0 0 34px; font-size:11px; font-weight:700; color:var(--lilac-deep); text-transform:uppercase; padding-top:2px;}
  .ev-time{flex:0 0 58px; font-size:12px; color:var(--muted); padding-top:1px;}
  .ev-text{flex:1; font-size:13px; color:var(--ink);}
  .pc-notes{font-size:12px; color:var(--lilac-deep); background:var(--lilac-soft); padding:8px 10px; border-radius:8px; margin-top:9px; line-height:1.45;}
  .pc-call{display:inline-block; margin-top:11px; font-size:13px; font-weight:600; color:#fff; background:var(--lilac); text-decoration:none; padding:9px 16px; border-radius:20px;}
  .pc-call:active{background:var(--lilac-deep);}
  .empty{text-align:center; color:var(--muted); padding:30px 10px; font-size:14px;}
  /* ---------- INFO VIEW ---------- */
  .info-card{background:var(--card); border:1px solid var(--line); border-radius:var(--radius-sm); padding:14px; margin-bottom:12px;}
  .info-card h3{font-family:var(--serif); font-weight:400; font-size:17px; color:var(--navy); margin:0 0 10px;}
  .info-row{display:flex; gap:10px; padding:7px 0; border-bottom:1px solid var(--line); font-size:13px;}
  .info-row:last-child{border-bottom:none;}
  .info-row .ir-k{flex:0 0 40%; color:var(--muted);}
  .info-row .ir-v{flex:1; color:var(--ink); font-weight:500;}
  .info-row .ir-v a{color:var(--lilac-deep); text-decoration:none;}
  .contact-sub{font-size:11px; font-weight:700; letter-spacing:.6px; text-transform:uppercase; color:var(--muted); margin:14px 0 6px;}
  .contact-sub:first-child{margin-top:2px;}
  .contact-row{display:flex; align-items:center; gap:11px; padding:9px 0; border-bottom:1px solid var(--line);}
  .contact-row:last-child{border-bottom:none;}
  .contact-row .avatar{flex:0 0 36px; width:36px; height:36px; font-size:12px;}
  .cr-body{flex:1; min-width:0;}
  .cr-name{font-size:14px; font-weight:600; color:var(--ink);}
  .cr-role{font-size:11.5px; color:var(--muted); margin-top:1px;}
  .cr-call{flex:0 0 auto; font-size:13px; font-weight:600; color:var(--lilac-deep); text-decoration:none; padding:6px 11px; border:1px solid var(--lilac); border-radius:16px;}
  .cr-call:active{background:var(--lilac-soft);}
  /* ---------- NAV ---------- */
  nav{
    position:fixed; bottom:0; left:0; right:0; background:var(--card);
    border-top:1px solid var(--line); display:flex; z-index:40;
    padding-bottom:env(safe-area-inset-bottom);
  }
  .nav-btn{
    flex:1; padding:9px 0 8px; background:none; border:none; cursor:pointer;
    display:flex; flex-direction:column; align-items:center; gap:2px; font-family:var(--sans);
    color:var(--muted);
  }
  .nav-ic{font-size:20px; line-height:1;}
  .nav-lbl{font-size:10.5px; font-weight:600; letter-spacing:.2px;}
  .nav-btn.active{color:var(--lilac-deep);}
  /* misc */
  .pill{display:inline-block; font-size:10px; font-weight:700; letter-spacing:.5px; text-transform:uppercase;
    padding:2px 8px; border-radius:10px; background:var(--lilac-soft); color:var(--lilac-deep);}
</style>
</head>
<body>

<header>
  <h1 class="h-couple">Abby <span class="amp">&amp;</span> Jacob</h1>
  <p class="h-sub" id="headerSub">The Ranch at Silver Creek · June 13, 2026</p>
</header>

<main>
  <!-- ============ HOME ============ -->
  <section class="view active" id="view-home"></section>

  <!-- ============ SCHEDULE ============ -->
  <section class="view" id="view-schedule">
    <h2 class="section">Full schedule</h2>
    <div class="day-tabs" id="dayTabs"></div>
    <div class="day-head" id="dayHead"></div>
    <div id="schedList"></div>
  </section>

  <!-- ============ PEOPLE ============ -->
  <section class="view" id="view-people">
    <h2 class="section">Who's who</h2>
    <div class="search-wrap">
      <span class="search-ic">&#128269;</span>
      <input class="search-box" id="searchBox" type="text" placeholder="Search a name…" autocomplete="off">
    </div>
    <div class="filter-chips" id="filterChips"></div>
    <div id="peopleList"></div>
  </section>

  <!-- ============ INFO ============ -->
  <section class="view" id="view-info">
    <h2 class="section">Key info</h2>
    <div id="infoContent"></div>
  </section>
</main>

<nav>
  <button class="nav-btn active" data-view="home"><span class="nav-ic">&#127968;</span><span class="nav-lbl">Today</span></button>
  <button class="nav-btn" data-view="schedule"><span class="nav-ic">&#128197;</span><span class="nav-lbl">Schedule</span></button>
  <button class="nav-btn" data-view="people"><span class="nav-ic">&#128101;</span><span class="nav-lbl">People</span></button>
  <button class="nav-btn" data-view="info"><span class="nav-ic">&#128205;</span><span class="nav-lbl">Info</span></button>
</nav>

<script src="data.js"></script>
<script>
(function(){
  "use strict";
  const D = WEDDING;
  const dayOrder = ["Wed","Thu","Fri","Sat","Sun","Mon"];
  const dayDates = { Wed:"2026-06-10", Thu:"2026-06-11", Fri:"2026-06-12", Sat:"2026-06-13", Sun:"2026-06-14", Mon:"2026-06-15" };

  // ---- which day is "today" (clamped into the wedding window) ----
  function todayKey(){
    const now = new Date();
    const iso = now.getFullYear()+"-"+String(now.getMonth()+1).padStart(2,"0")+"-"+String(now.getDate()).padStart(2,"0");
    for(const k of dayOrder){ if(dayDates[k]===iso) return k; }
    // before the weekend → show Wednesday; after → show Monday
    if(iso < dayDates.Wed) return null;      // "upcoming" state
    if(iso > dayDates.Mon) return "Mon";
    return null;
  }
  const TODAY = todayKey();

  // ===================== HOME =====================
  function renderHome(){
    const el = document.getElementById("view-home");
    let html = "";

    // banner
    if(TODAY && D.days[TODAY]){
      const d = D.days[TODAY];
      html += `<div class="today-banner">
        <p class="tb-label">Today</p>
        <p class="tb-day">${d.label}</p>
        <p class="tb-sub">${d.sub}</p>
        ${countdownHTML()}
      </div>`;
    } else {
      html += `<div class="today-banner">
        <p class="tb-label">Counting down</p>
        <p class="tb-day">The big day is coming</p>
        <p class="tb-sub">Saturday, June 13 · 5:00 PM ceremony</p>
        ${countdownHTML()}
      </div>`;
    }

    // quick links
    html += `<div class="quick-grid">
      <button class="quick-card" data-go="schedule"><div class="qc-icon">&#128197;</div><div class="qc-title">Full schedule</div><div class="qc-sub">All 6 days</div></button>
      <button class="quick-card" data-go="people"><div class="qc-icon">&#128101;</div><div class="qc-title">Find a person</div><div class="qc-sub">Search &amp; filter</div></button>
      <button class="quick-card" data-go="info"><div class="qc-icon">&#128205;</div><div class="qc-title">Locations</div><div class="qc-sub">Addresses &amp; cars</div></button>
      <button class="quick-card" data-go="people"><div class="qc-icon">&#128694;</div><div class="qc-title">Your role</div><div class="qc-sub">What you're doing</div></button>
    </div>`;

    // day-at-a-glance
    const glanceKey = TODAY || "Sat";
    const gd = D.days[glanceKey];
    html += `<h2 class="section">${TODAY ? "Today at a glance" : "Wedding day at a glance"}</h2>`;
    html += `<div class="info-card" style="padding:6px 14px;">`;
    gd.rows.forEach(r=>{
      html += `<div class="glance-row ${r.highlight?'hl':''}">
        <div class="glance-time">${r.time}</div>
        <div class="glance-body">
          <div class="glance-event">${r.event}${r.highlight?'<span class="star">&#9733;</span>':''}</div>
          ${r.who && r.who!=="—" ? `<div class="glance-who">${r.who}</div>`:''}
        </div>
      </div>`;
    });
    html += `</div>`;
    el.innerHTML = html;

    el.querySelectorAll("[data-go]").forEach(b=>{
      b.addEventListener("click",()=>switchView(b.dataset.go));
    });
  }

  function countdownHTML(){
    const target = new Date(D.meta.ceremonyTime).getTime();
    const now = Date.now();
    let diff = Math.max(0, target - now);
    const days = Math.floor(diff/86400000); diff-=days*86400000;
    const hrs = Math.floor(diff/3600000); diff-=hrs*3600000;
    const mins = Math.floor(diff/60000);
    if(target < now){
      return `<div class="countdown"><div class="cd-box" style="flex:none;width:100%;"><div class="cd-num" style="font-size:16px;">Just married &#128144;</div></div></div>`;
    }
    return `<div class="countdown">
      <div class="cd-box"><div class="cd-num">${days}</div><div class="cd-lbl">Days</div></div>
      <div class="cd-box"><div class="cd-num">${hrs}</div><div class="cd-lbl">Hrs</div></div>
      <div class="cd-box"><div class="cd-num">${mins}</div><div class="cd-lbl">Min</div></div>
    </div>`;
  }

  // ===================== SCHEDULE =====================
  let activeDay = TODAY || "Sat";
  function renderDayTabs(){
    const wrap = document.getElementById("dayTabs");
    wrap.innerHTML = dayOrder.map(k=>{
      const isToday = k===TODAY;
      return `<button class="day-tab ${k===activeDay?'active':''} ${isToday?'is-today':''}" data-day="${k}">${k}</button>`;
    }).join("");
    wrap.querySelectorAll(".day-tab").forEach(b=>{
      b.addEventListener("click",()=>{ activeDay=b.dataset.day; renderDayTabs(); renderSchedule(); });
    });
  }
  function renderSchedule(){
    const d = D.days[activeDay];
    document.getElementById("dayHead").innerHTML =
      `<p class="dh-title">${d.label}</p><p class="dh-sub">${d.sub}</p>`;
    const list = document.getElementById("schedList");
    list.innerHTML = d.rows.map(r=>`
      <div class="sched-row ${r.highlight?'hl':''}">
        <div class="sr-time">${r.time}</div>
        <div class="sr-body">
          <div class="sr-event">${r.event}${r.highlight?'<span class="star">&#9733;</span>':''}</div>
          <div class="sr-meta">${r.who&&r.who!=="—"?`<b>${r.who}</b>`:''}${(r.vehicle&&r.vehicle!=="—")?` · ${r.vehicle}`:''}</div>
          ${r.notes?`<div class="sr-notes">${r.notes}</div>`:''}
        </div>
      </div>`).join("");
  }

  // ===================== PEOPLE =====================
  let activeFilter = "All";
  let searchTerm = "";
  function renderChips(){
    const chips = ["All", ...D.groups];
    const wrap = document.getElementById("filterChips");
    wrap.innerHTML = chips.map(c=>`<button class="chip ${c===activeFilter?'active':''}" data-f="${c}">${c}</button>`).join("");
    wrap.querySelectorAll(".chip").forEach(b=>{
      b.addEventListener("click",()=>{ activeFilter=b.dataset.f; renderChips(); renderPeople(); });
    });
  }
  function gClass(g){ return "g-"+g.replace(/\s/g,""); }

  // phone lookup: normalize names, match People → contacts
  const phoneMap = {};
  (D.contacts||[]).forEach(c=>{
    if(c.phone) phoneMap[c.name.toLowerCase()] = c.phone;
  });
  function lookupPhone(name){
    return phoneMap[name.toLowerCase()] || null;
  }
  function prettyPhone(p){
    return p.length===10 ? `(${p.slice(0,3)}) ${p.slice(3,6)}-${p.slice(6)}` : p;
  }

  function renderPeople(){
    const list = document.getElementById("peopleList");
    let people = D.people.slice();
    if(activeFilter!=="All") people = people.filter(p=>p.group===activeFilter);
    if(searchTerm){
      const t = searchTerm.toLowerCase();
      people = people.filter(p=>p.name.toLowerCase().includes(t)||p.role.toLowerCase().includes(t));
    }
    if(!people.length){ list.innerHTML = `<div class="empty">No one found. Try a different name.</div>`; return; }
    list.innerHTML = people.map((p,i)=>{
      const evs = p.events.map(e=>`
        <div class="ev-row"><div class="ev-day">${e.day}</div><div class="ev-time">${e.time}</div><div class="ev-text">${e.text}</div></div>
      `).join("");
      const phone = lookupPhone(p.name);
      const callBtn = phone
        ? `<a class="pc-call" href="tel:${phone}" onclick="event.stopPropagation()">&#128222; Call ${prettyPhone(phone)}</a>`
        : '';
      return `<div class="person-card" data-idx="${i}">
        <div class="pc-head">
          <div class="avatar ${gClass(p.group)}">${p.initials}</div>
          <div><div class="pc-name">${p.name}</div><div class="pc-role">${p.role}</div></div>
          <div class="pc-chev">&#8250;</div>
        </div>
        <div class="pc-events">
          ${evs || '<div class="ev-row"><div class="ev-text" style="color:var(--muted);">No scheduled timeline items.</div></div>'}
          ${p.notes?`<div class="pc-notes">${p.notes}</div>`:''}
          ${callBtn}
        </div>
      </div>`;
    }).join("");
    list.querySelectorAll(".person-card").forEach(c=>{
      c.addEventListener("click",()=>c.classList.toggle("open"));
    });
  }
  document.getElementById("searchBox").addEventListener("input",e=>{
    searchTerm = e.target.value.trim(); renderPeople();
  });

  // ===================== INFO =====================
  function renderInfo(){
    const el = document.getElementById("infoContent");
    let html = "";

    // ---- Contacts ----
    html += `<div class="info-card"><h3>Contacts</h3>`;
    (D.contacts||[]).forEach(c=>{
      if(c.section){ html += `<div class="contact-sub">${c.section}</div>`; return; }
      const initials = c.name.split(/\s+/).slice(0,2).map(w=>w[0]).join("").toUpperCase();
      const pretty = c.phone.length===10
        ? `(${c.phone.slice(0,3)}) ${c.phone.slice(3,6)}-${c.phone.slice(6)}`
        : c.phone;
      html += `<div class="contact-row">
        <div class="avatar">${initials}</div>
        <div class="cr-body">
          <div class="cr-name">${c.name}</div>
          <div class="cr-role">${c.role}</div>
        </div>
        <a class="cr-call" href="tel:${c.phone}">Call</a>
      </div>`;
    });
    html += `</div>`;

    html += `<div class="info-card"><h3>Locations</h3>`;
    D.locations.forEach(l=>{
      const q = encodeURIComponent(l.address);
      html += `<div class="info-row"><div class="ir-k">${l.name}</div><div class="ir-v"><a href="https://maps.google.com/?q=${q}" target="_blank">${l.address}</a></div></div>`;
    });
    html += `</div>`;
    html += `<div class="info-card"><h3>Vehicles &amp; drivers</h3>`;
    D.vehicles.forEach(v=>{
      html += `<div class="info-row"><div class="ir-k">${v.name}</div><div class="ir-v">${v.driver}<div style="font-weight:400;color:var(--muted);font-size:12px;">${v.capacity}</div></div></div>`;
    });
    html += `</div>`;
    html += `<div class="info-card"><h3>Good to know</h3>
      <div class="info-row"><div class="ir-k">Specialty drinks</div><div class="ir-v">His: Sweetheart Spritz<br>Hers: Pineapple Kiss<br>Ours: Honeymoon Cruise</div></div>
      <div class="info-row"><div class="ir-k">Departure contact</div><div class="ir-v">Preethy Edwin · <a href="tel:5105746659">510-574-6659</a></div></div>
      <div class="info-row"><div class="ir-k">Wedding colors</div><div class="ir-v">Lilac, White &amp; Navy</div></div>
      <div class="info-row"><div class="ir-k">Dietary flags</div><div class="ir-v">1 celiac guest (gluten labeled) · 1 family w/ tree nut concern</div></div>
    </div>`;
    el.innerHTML = html;
  }

  // ===================== NAV =====================
  function switchView(name){
    document.querySelectorAll(".view").forEach(v=>v.classList.remove("active"));
    document.getElementById("view-"+name).classList.add("active");
    document.querySelectorAll(".nav-btn").forEach(b=>b.classList.toggle("active", b.dataset.view===name));
    window.scrollTo(0,0);
  }
  document.querySelectorAll(".nav-btn").forEach(b=>{
    b.addEventListener("click",()=>switchView(b.dataset.view));
  });

  // ---- init ----
  renderHome();
  renderDayTabs();
  renderSchedule();
  renderChips();
  renderPeople();
  renderInfo();

  // service worker for installability / offline
  if('serviceWorker' in navigator){
    navigator.serviceWorker.register('sw.js').catch(()=>{});
  }
})();
</script>
</body>
</html>
